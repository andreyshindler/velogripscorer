name: Deploy to VPS

# Runs on the self-hosted runner installed on the VPS. On a push to main that
# touches the web/server/Docker files (or on manual dispatch) it fast-forwards
# the deployment clone to main and rebuilds the Docker stack, then pings
# Telegram with the result. Android-only or docs-only merges don't redeploy.
# Only main triggers it — never pull requests.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'openapi.yaml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Pull main and rebuild the stack
        id: deploy
        env:
          # Override in repo settings (Variables) if the clone lives elsewhere.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR:-$HOME/projects/velogripscorer}"
          echo "Deploying to main in $(pwd)"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
          docker compose ps

          # Wait for the app to ANSWER, not just for the container to exist.
          # Read the port and prefix from .env so this follows the stack it is
          # deploying instead of hard-coding them.
          # "|| true": a missing .env must not kill the step with a bare exit 2.
          PORT="$(sed -n 's/^HOST_PORT=//p' .env 2>/dev/null | tail -1 || true)"
          BASE="$(sed -n 's/^BASE_PATH=//p' .env 2>/dev/null | tail -1 || true)"
          URL="http://127.0.0.1:${PORT:-3000}${BASE}/api/health"
          echo "Waiting for $URL"
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 "$URL" >/dev/null 2>&1; then
              healthy=1; echo "healthy after $((i * 2))s"; break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::app did not answer $URL within 60s"
            # Put the reason in THIS log. Without it a failure says only
            # "exit code 1" and the cause has to be chased on the box.
            docker compose logs --tail=80 app || true
            exit 1
          fi

      - name: Notify Telegram
        if: always() && env.TG_BOT_TOKEN != ''
        env:
          STATUS: ${{ steps.deploy.outcome }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          if [ "$STATUS" = "success" ]; then ICON="✅"; WORD="deployed"; else ICON="❌"; WORD="deploy FAILED"; fi
          # First line, capped — pure bash so a long/multi-line commit message
          # can't SIGPIPE `head` and (under pipefail) fail this best-effort step.
          SUBJECT="${COMMIT_MSG:-manual dispatch}"
          SUBJECT="${SUBJECT%%$'\n'*}"
          SUBJECT="${SUBJECT:0:200}"
          TEXT="${ICON} VeloGrip ${WORD} — ${GITHUB_SHA::7} on main
          ${SUBJECT}
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Best-effort; a failed notification must not fail the deploy.
          curl -sS \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" > /dev/null || true
