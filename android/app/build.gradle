plugins {
    id 'com.android.application'
}

// versionCode tracks the commit count, so every build gets a new, increasing
// number without anyone remembering to bump it — 27 Android commits shipped as
// "build 59" because it was a hand-edited literal. CI must check out full
// history (fetch-depth: 0) or this comes back as 1; the floor below keeps a
// shallow or git-less build from ever handing out a LOWER code than the last
// hand-set one, which Android would refuse to install over.
def BASE_VERSION_CODE = 59
def gitCommitCount = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        proc.waitForOrKill(10000)
        return proc.exitValue() == 0 ? proc.text.trim().toInteger() : 0
    } catch (Exception ignored) {
        return 0
    }
}()

android {
    namespace 'com.velogrip.rfid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.velogrip.rfid'
        minSdk 26
        targetSdk 33
        versionCode Math.max(gitCommitCount, BASE_VERSION_CODE + 1)
        versionName '0.7.0'
    }

    // A fixed debug keystore committed at android/debug.keystore so every build
    // (local or CI) signs with the SAME key. Without it, each clean CI runner
    // auto-generates a random debug key, and Android then refuses to install a
    // new APK over an old one (signature mismatch). A debug key carries no real
    // security, so committing it is standard for internal distribution.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Deliberately zero dependencies: plain android.app + java.net keeps the APK
// tiny and the build independent of androidx artifact resolution.
dependencies {
    // Google Code Scanner (ML Kit, via Play Services): an in-app QR scanner with
    // no camera permission and no bundled UI — the module is fetched on demand.
    // The app's first dependency; enables the "Scan QR" button on the checkpoint
    // join screen. (useAndroidX is on in gradle.properties for this.)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

// Single source of truth for the CI notification: the workflow used to grep the
// literals out of this file, which stops working once versionCode is computed.
tasks.register('printVersion') {
    doLast { println "${android.defaultConfig.versionName} ${android.defaultConfig.versionCode}" }
}
