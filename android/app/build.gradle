plugins {
    id 'com.android.application'
}

android {
    namespace 'com.velogrip.rfid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.velogrip.rfid'
        minSdk 26
        targetSdk 33
        versionCode 43
        versionName '0.6.19'
    }

    // A fixed debug keystore committed at android/debug.keystore so every build
    // (local or CI) signs with the SAME key. Without it, each clean CI runner
    // auto-generates a random debug key, and Android then refuses to install a
    // new APK over an old one (signature mismatch). A debug key carries no real
    // security, so committing it is standard for internal distribution.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Deliberately zero dependencies: plain android.app + java.net keeps the APK
// tiny and the build independent of androidx artifact resolution.
dependencies {
    // Google Code Scanner (ML Kit, via Play Services): an in-app QR scanner with
    // no camera permission and no bundled UI — the module is fetched on demand.
    // The app's first dependency; enables the "Scan QR" button on the checkpoint
    // join screen. (useAndroidX is on in gradle.properties for this.)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
