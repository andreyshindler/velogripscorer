<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VeloGripScorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#0b39c4"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd4ff"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (safe for maskable home-screen icons) -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- speedometer gauge, centred, within the maskable safe zone -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- outer 270° arc, open at the bottom -->
    <path d="M 159 372 A 150 150 0 1 1 353 372" stroke-opacity="0.30" stroke-width="26"/>
    <!-- coloured progress portion of the arc (left → top → upper right) -->
    <path d="M 159 372 A 150 150 0 0 1 372 175" stroke-width="26"/>
  </g>

  <!-- tick marks around the arc -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-linecap="round" stroke-width="9">
    <g transform="rotate(-135 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(-90 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(-45 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(0 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(45 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(90 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
    <g transform="rotate(135 256 256)"><line x1="256" y1="140" x2="256" y2="168"/></g>
  </g>

  <!-- needle pointing to the upper-right (fast) -->
  <g transform="rotate(58 256 256)">
    <path d="M 256 256 L 244 250 L 256 120 L 268 250 Z" fill="url(#needle)"/>
  </g>

  <!-- centre hub -->
  <circle cx="256" cy="256" r="34" fill="#0b39c4"/>
  <circle cx="256" cy="256" r="34" fill="none" stroke="#ffffff" stroke-width="10"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
